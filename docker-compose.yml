# docker-compose.yml — 2C2G 单机一键部署
# MySQL 使用外部实例，请在 .env 中配置 DB_HOST / DB_PORT / DB_USER / DB_PASSWORD / DB_NAME。
version: "3.8"

services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: city_roam_app
    env_file: .env
    ports:
      - "8080:8080"
    volumes:
      - uploads:/app/uploads
      - ./backend/static:/app/static:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 320M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # 前端：多阶段构建（node 打包 → caddy 托管）+ 反向代理 /api 到后端。
  # 高德 Key 属前端公开 Key，由根 .env 通过 build args 注入 Vite 构建。
  caddy:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_AMAP_KEY: ${VITE_AMAP_KEY:-}
        VITE_AMAP_SECURITY_CODE: ${VITE_AMAP_SECURITY_CODE:-}
        VITE_API_BASE: ${VITE_API_BASE:-/api}
    container_name: city_roam_caddy
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./backend/static:/srv/static:ro
      - uploads:/srv/uploads:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  uploads:
