# docker-compose.yml — 2C2G 单机一键部署
# 数据库使用外部 MySQL 实例，通过 .env 中的 DB_HOST/DB_PORT 配置连接。
version: "3.8"

services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: city_roam_app
    env_file: .env
    ports:
      - "8080:8080"
    volumes:
      - uploads:/app/uploads
      - static:/app/static
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 320M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # 前端：多阶段构建（node 打包 → caddy 托管）+ 反向代理 /api 到后端。
  # 高德 Key 由 frontend/.env 在构建期被 Vite 自动注入，无需 build args。
  caddy:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: city_roam_caddy
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - static:/srv/static:ro
      - uploads:/srv/uploads:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  uploads:
  static: